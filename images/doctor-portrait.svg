<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="docBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF7F6"/><stop offset="100%" stop-color="#D5EFEC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" rx="16" fill="url(#docBg)"/>
  <!-- Decorative circles -->
  <circle cx="480" cy="120" r="100" fill="#2A9D8F" opacity="0.06"/>
  <circle cx="120" cy="680" r="80" fill="#2A9D8F" opacity="0.05"/>
  <!-- Person silhouette -->
  <g transform="translate(300,350)">
    <!-- Head -->
    <circle cx="0" cy="-60" r="80" fill="#2A9D8F" opacity="0.15"/>
    <!-- Shoulders/body -->
    <path d="M-130 120 C-130 40 -70 0 0 0 C70 0 130 40 130 120 L130 200 L-130 200Z" fill="#2A9D8F" opacity="0.1"/>
    <!-- White coat lapels -->
    <path d="M-30 0 L-50 120 L-10 120 L0 30Z" fill="white" opacity="0.3"/>
    <path d="M30 0 L50 120 L10 120 L0 30Z" fill="white" opacity="0.3"/>
    <!-- Glasses -->
    <circle cx="-25" cy="-65" r="22" fill="none" stroke="#2A9D8F" stroke-width="2.5" opacity="0.25"/>
    <circle cx="25" cy="-65" r="22" fill="none" stroke="#2A9D8F" stroke-width="2.5" opacity="0.25"/>
    <line x1="3" y1="-65" x2="-3" y2="-65" stroke="#2A9D8F" stroke-width="2.5" opacity="0.25"/>
    <!-- Smile -->
    <path d="M-20 -45 Q0 -30 20 -45" fill="none" stroke="#2A9D8F" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
    <!-- Name badge -->
    <rect x="-25" y="60" width="50" height="35" rx="4" fill="white" opacity="0.4"/>
    <rect x="-15" y="70" width="30" height="3" rx="1" fill="#2A9D8F" opacity="0.2"/>
    <rect x="-15" y="78" width="20" height="3" rx="1" fill="#2A9D8F" opacity="0.15"/>
  </g>
  <!-- Text -->
  <text x="300" y="660" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#2A9D8F" opacity="0.5" font-weight="500">Dimitrios Mavroeidakos</text>
  <text x="300" y="690" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#2A9D8F" opacity="0.4">Kieferorthopäde</text>
</svg>
