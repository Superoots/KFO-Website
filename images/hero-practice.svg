<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#3DB8A9"/>
    </linearGradient>
    <linearGradient id="heroCircle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="1000" rx="24" fill="url(#heroBg)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="150" r="200" fill="url(#heroCircle)"/>
  <circle cx="150" cy="850" r="180" fill="url(#heroCircle)"/>
  <circle cx="400" cy="500" r="300" fill="url(#heroCircle)"/>
  <!-- Smile icon -->
  <g transform="translate(400,420)" opacity="0.9">
    <circle cx="0" cy="0" r="160" fill="none" stroke="white" stroke-width="6"/>
    <circle cx="-55" cy="-30" r="14" fill="white"/>
    <circle cx="55" cy="-30" r="14" fill="white"/>
    <path d="M-70 30 Q0 110 70 30" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Tooth icon top right -->
  <g transform="translate(620,280) scale(1.2)" opacity="0.3">
    <path d="M0-40 C-25-40 -35-20 -35 0 C-35 25 -20 55 -15 55 C-10 55 -8 30 0 30 C8 30 10 55 15 55 C20 55 35 25 35 0 C35-20 25-40 0-40Z" fill="white"/>
  </g>
  <!-- Tooth icon bottom left -->
  <g transform="translate(180,700) scale(1)" opacity="0.25">
    <path d="M0-40 C-25-40 -35-20 -35 0 C-35 25 -20 55 -15 55 C-10 55 -8 30 0 30 C8 30 10 55 15 55 C20 55 35 25 35 0 C35-20 25-40 0-40Z" fill="white"/>
  </g>
  <!-- Text -->
  <text x="400" y="660" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" fill="white" opacity="0.7" font-weight="500">Kieferorthopädie Übersee</text>
  <text x="400" y="700" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="white" opacity="0.5">Ihr Lächeln in besten Händen</text>
  <!-- Sparkle decorations -->
  <g opacity="0.4" fill="white">
    <circle cx="200" cy="200" r="4"/>
    <circle cx="600" cy="800" r="3"/>
    <circle cx="700" cy="450" r="5"/>
    <circle cx="100" cy="550" r="3"/>
    <circle cx="500" cy="150" r="4"/>
    <circle cx="300" cy="900" r="3"/>
  </g>
</svg>
