<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF7F6"/>
      <stop offset="100%" stop-color="#D5EFEC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="16" fill="url(#aboutBg)"/>
  <!-- Decorative shapes -->
  <circle cx="600" cy="100" r="120" fill="#2A9D8F" opacity="0.08"/>
  <circle cx="200" cy="500" r="100" fill="#2A9D8F" opacity="0.06"/>
  <!-- Practice building illustration -->
  <g transform="translate(400,280)">
    <!-- Building base -->
    <rect x="-160" y="-80" width="320" height="200" rx="8" fill="#2A9D8F" opacity="0.15"/>
    <!-- Door -->
    <rect x="-30" y="20" width="60" height="100" rx="4" fill="#2A9D8F" opacity="0.25"/>
    <circle cx="20" cy="70" r="4" fill="#2A9D8F" opacity="0.4"/>
    <!-- Windows -->
    <rect x="-130" y="-50" width="60" height="50" rx="4" fill="white" opacity="0.8"/>
    <rect x="70" y="-50" width="60" height="50" rx="4" fill="white" opacity="0.8"/>
    <rect x="-130" y="20" width="60" height="50" rx="4" fill="white" opacity="0.8"/>
    <rect x="70" y="20" width="60" height="50" rx="4" fill="white" opacity="0.8"/>
    <!-- Cross/medical symbol -->
    <rect x="-10" y="-70" width="20" height="40" rx="3" fill="#2A9D8F" opacity="0.5"/>
    <rect x="-20" y="-60" width="40" height="20" rx="3" fill="#2A9D8F" opacity="0.5"/>
    <!-- Roof -->
    <path d="M-180-80 L0-160 L180-80Z" fill="#2A9D8F" opacity="0.2"/>
  </g>
  <!-- Text -->
  <text x="400" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#2A9D8F" opacity="0.6" font-weight="500">Unsere Praxis</text>
</svg>
